<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 320px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #fff;
        color: #1e293b;
        padding: 16px;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid #e2e8f0;
      }
      .header h1 {
        font-size: 16px;
        font-weight: 700;
      }
      .status-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        font-size: 13px;
        color: #475569;
      }
      .status-dot {
        width: 8px; height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .status-dot.ok { background: #22c55e; }
      .status-dot.err { background: #ef4444; }
      .stat-box {
        background: #f8fafc;
        border-radius: 8px;
        padding: 12px;
        margin-top: 12px;
      }
      .stat-box .stat-label {
        font-size: 12px;
        color: #64748b;
        margin-bottom: 2px;
      }
      .stat-box .stat-value {
        font-size: 20px;
        font-weight: 700;
      }
      .page-url {
        font-size: 11px;
        color: #94a3b8;
        margin-top: 12px;
        word-break: break-all;
        max-height: 36px;
        overflow: hidden;
      }
      .actions {
        margin-top: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .actions button {
        width: 100%;
        padding: 8px;
        border: 1px solid #e2e8f0;
        border-radius: 6px;
        background: #fff;
        font-size: 13px;
        cursor: pointer;
        font-family: inherit;
        color: #1e293b;
        transition: background 0.15s;
      }
      .actions button:hover { background: #f1f5f9; }
      .actions button.primary {
        background: #2563eb;
        color: #fff;
        border-color: #2563eb;
      }
      .actions button.primary:hover { background: #1d4ed8; }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>📖 Doc Dictionary</h1>
    </div>

    <div class="status-row">
      <span id="api-dot" class="status-dot"></span>
      <span id="api-status">Checking API...</span>
    </div>

    <div class="stat-box">
      <div class="stat-label">Words on this page</div>
      <div id="word-count" class="stat-value">—</div>
    </div>

    <div class="page-url" id="page-url"></div>

    <div class="actions">
      <button class="primary" id="btn-dashboard">Open Dashboard</button>
      <button id="btn-refresh">↻ Re-highlight this page</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
